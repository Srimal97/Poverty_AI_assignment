name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime dependencies
        run: pip install -r requirements.txt pytest
      - name: Model contract & smoke tests
        run: pytest -q tests
      - name: App import check
        run: python -c "import ast,sys; ast.parse(open('app/app.py').read()); print('app OK')"
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hies-poverty-screener .
